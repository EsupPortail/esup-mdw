# =====================================================================
# MonDossierWeb - exemple de configuration d'environnement
# =====================================================================
# Ce fichier remplace l'ancien context.xml (paramètres JNDI Tomcat).
# À copier en "application.yml" :
#  - à la racine du projet pour le développement (mvn spring-boot:run)
#  - dans un répertoire de config du serveur (ex: $CATALINA_BASE/lib ou
#    répertoire courant du process, ou via spring.config.location)
# Les valeurs par défaut sont définies dans application-defaults.yml (embarqué).
# =====================================================================

# URL de l'application
app.url: http://mdw.univ.fr:8080

# URL du CAS
cas.url: https://auth.univ.fr

spring:
    datasource:
        # Base MySQL/MariaDB propre à l'application
        # (utiliser jdbc:mariadb://... pour un serveur MariaDB, jdbc:mysql://... pour MySQL)
        mdw:
            url: jdbc:mariadb://localhost:3306/mdw
            username: usermdw
            password: xxxxx
        # Connexion sur Apogée (lecture seule)
        apogee:
            url: jdbc:oracle:thin:@apogee.univ.fr:1521:APOGEE
            username: usermdw
            password: xxxxx
    # Serveur SMTP (alertes applicatives)
    mail:
        host: smtp.univ.fr
        port: 25

# Envoi des mails d'erreur
mail.from: mdw@univ.fr
mail.to: error@univ.fr
# Plage horaire quotidienne pendant laquelle l'envoi de mails d'erreur est suspendu
mail.startDisabling: "00:15"
mail.stopDisabling: "00:45"

# Clé apogée pour décrypter les Blob de la base Apogée (ex : signature certificat de scolarité)
clefApogeeDecryptBlob: cleapogee

# Nombre max de requêtes par minute pour une même IP sur l'url /login/cas (0 = désactivé)
ratelimiter.maxrequest: 0

# Durée max des sessions inactives
server.servlet.session.timeout: 3600s

# --- Configuration du LDAP ---
# Url du ldap. Si plusieurs urls, les séparer par des points virgule
ldap.url: ldap://ldap.univ.fr:389/dc=univ,dc=fr
# Identifiants (facultatif)
ldap.userDn: userDn
ldap.password: xxxxx
ldap.uid.attribute: uid
ldap.ou.people: ou=people
ldap.ou.student: ou=people

# --- WS uPortal ---
uportal.ws: http://ent.univ.fr/services/UportalService
# Liste des groupes uportal autorisés, séparés par un point virgule
uportal.groupes.autorises: Utilisateurs MDW

# --- Gestion des accès ---
# true : on vérifie l'accès dans la table utilisateur d'Apogée
loginApogee: true
# true : on teste le témoin EN SERVICE de la table utilisateur d'Apogée
checkTesUtilisateurApogee: false
# Profil attribué aux utilisateurs Apogée (ENS ou GEST)
profilUtilisateurApogee: ENS
attributGroupeLdap: ""
listeGroupesLdap: ""
listeGroupesLdapAdmin: ""
attributLdapEtudiant: edupersonprimaryaffiliation
typeEtudiantLdap: student
attributLdapCodEtu: supannEtuId
attributLdapDoctorant: ""
valeursAttributLdapDoctorant: ""
attributLdapGestionnaire: ""
valeursAttributLdapGestionnaire: ""

# --- WebServices Apogée (AMUE) ---
apoWsUsername: ""
apoWsPassword: ""
apoShowSql: false
sourceResultats: Apogee

# --- Génération PDF ---
EnablePdfSecurity: true
pdf.sign.keystore.path: C://monkeystore.keystore
pdf.sign.password: ""
pdf.sign.creator: ""
pdf.sign.reason: ""
pdf.sign.location: ""
pdf.sign.contact: ""
pdf.sign.alt.tsa.url: http://timestamp.digicert.com
pdf.sign.alt.tsa.username: toto
pdf.sign.alt.tsa.password: pwd
pdf.sign.alt.tsa.tokensize: 8192

# --- ElasticSearch (recherche rapide) ---
param.elasticsearch.url: localhost
# Port HTTP Elasticsearch (ex. 9200/9202) — plus le port transport 9300
param.elasticsearch.port: 9200
# Obsolète : conservé pour rétro-compatibilité mais ignoré en mode REST
param.elasticsearch.cluster: dev-1.3.4
param.elasticsearch.index: apogee
param.elasticsearch.index.champrecherche: lib_desc_obj
param.elasticsearch.index.champcodeobjet: cod_obj
param.elasticsearch.index.champversionobjet: cod_vrs_obj
param.elasticsearch.index.champlibelleobjet: lib_obj
# Champ portant le type d'objet (CMP/VET/ELP/ETU) — utilisé uniquement avec ES 8/9
param.elasticsearch.index.champtypeobjet: type_objet
# Autocomplétion sur les ELP
recherche.autocompletion.elp: false

# true si les mails de l'état-civil doivent être récupérés dans l'annuaire
param.apogee.mail.annuaire: false

# --- Implémentations des services ---
# emailConverterBasicImpl | emailConverterLdapImpl | emailConverterUnivLorraineImpl
emailConverter.implementation: emailConverterLdapImpl
codetuFromLogin.implementation: codetuFromLoginLdapImpl
# loginFromCodetuLdapImpl | loginFromCodetuUnivLorraineImpl
loginFromCodetu.implementation: loginFromCodetuLdapImpl
# Façon d'afficher le nom des étudiants : basique | standard
etatcivil.nom.affichage: standard
resultat.implementation: resultatController

# --- Serveur photo ---
# photoEmptyImpl | photoUnivLorraineImpl | photoUnivLorraineImplV2 | photoEsupSgc
serveurphoto.implementation: photoEmptyImpl
